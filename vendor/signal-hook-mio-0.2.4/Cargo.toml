[package]
name = "signal-hook"
version = "0.3.17"
authors = [ "Michal 'vorner' Vaner <vorner@vorner.cz>", "Thomas Himmelstoss <thimm@posteo.de>",]
description = "Unix signal handling"
documentation = "https://docs.rs/signal-hook"
repository = "https://github.com/vorner/signal-hook"
readme = "README.md"
keywords = [ "signal", "unix", "daemon",]
license = "Apache-2.0/MIT"
edition = "2018"

[features]
channel = []
default = [ "channel", "iterator",]
iterator = [ "channel",]
extended-siginfo = [ "channel", "iterator", "extended-siginfo-raw",]
extended-siginfo-raw = [ "cc",]

[dependencies]
libc = "^0.2"

[dev-dependencies]
serial_test = "^0.7"

[dependencies.signal-hook-registry]
version = "^1.4"
path = "signal-hook-registry"

[badges.maintenance]
status = "actively-developed"

[build-dependencies.cc]
version = "^1"
optional = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = [ "--cfg", "docsrs",]
