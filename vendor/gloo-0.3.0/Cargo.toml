[package]
authors = [ "Rust and WebAssembly Working Group",]
description = "A modular toolkit for Rust and WebAssembly"
edition = "2021"
license = "MIT OR Apache-2.0"
name = "gloo"
readme = "README.md"
version = "0.9.0"
repository = "https://github.com/rustwasm/gloo"
homepage = "https://gloo-rs.web.app/"
documentation = "https://docs.rs/gloo/"
categories = [ "api-bindings", "wasm",]
rust-version = "1.64"

[features]
default = [ "timers", "events", "file", "dialogs", "storage", "render", "console", "utils", "history", "worker", "net",]
futures = [ "timers", "file", "worker", "gloo-timers/futures", "gloo-file/futures", "gloo-worker/futures",]
timers = [ "gloo-timers",]
events = [ "gloo-events",]
file = [ "gloo-file",]
dialogs = [ "gloo-dialogs",]
storage = [ "gloo-storage",]
render = [ "gloo-render",]
console = [ "gloo-console",]
utils = [ "gloo-utils",]
history = [ "gloo-history",]
worker = [ "gloo-worker",]
net = [ "gloo-net",]

[dependencies.gloo-timers]
version = "0.3"
path = "crates/timers"
optional = true

[dependencies.gloo-events]
version = "0.2"
path = "crates/events"
optional = true

[dependencies.gloo-file]
version = "0.3"
path = "crates/file"
optional = true

[dependencies.gloo-dialogs]
version = "0.2"
path = "crates/dialogs"
optional = true

[dependencies.gloo-storage]
version = "0.3"
path = "crates/storage"
optional = true

[dependencies.gloo-render]
version = "0.2"
path = "crates/render"
optional = true

[dependencies.gloo-console]
version = "0.3"
path = "crates/console"
optional = true

[dependencies.gloo-utils]
version = "0.2"
path = "crates/utils"
optional = true

[dependencies.gloo-history]
version = "0.2"
path = "crates/history"
optional = true

[dependencies.gloo-worker]
version = "0.4"
path = "crates/worker"
optional = true

[dependencies.gloo-net]
version = "0.4"
path = "crates/net"
optional = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = [ "--cfg", "docsrs",]
rustc-args = [ "--cfg", "docsrs",]
