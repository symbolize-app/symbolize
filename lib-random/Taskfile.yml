run: when_changed
tasks:
  check:
    cmd: buck2 build //lib-random:check
  format:check:
    aliases:
    - fc
    cmd: buck2 build //lib-random:format-check
  build:
    dir: '{{.TASKFILE_DIR}}'
    cmd: gleam build
  test:browser:
    deps:
    - build
    dir: '{{.TASKFILE_DIR}}/../dev-browser-test'
    cmd: gleam run --module lib_random_browser_driver_main
  link-build-dir:
    cmd:
      task: :build-dir:link-package-build-dir
      vars:
        NAME: '{{.NAME}}'
  lint:
    aliases:
    - l
    cmd: buck2 build //lib-random:lint
  test:debug:
    aliases:
    - test
    - t
    cmd: buck2 test -m debug //lib-random:test
  test:release:
    aliases:
    - tr
    cmd: buck2 test -m release //lib-random:test
vars:
  NAME: lib-random
version: '3'
