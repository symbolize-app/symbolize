run: when_changed
tasks:
  check:
    dir: '{{.TASKFILE_DIR}}'
    cmd: gleam check
  format:check:
    dir: '{{.TASKFILE_DIR}}'
    cmd: gleam format --check src
  test:
    deps:
      - build
    dir: '{{.TASKFILE_DIR}}'
    cmd: gleam run --module lib_concurrency_test_main
  build:
    dir: '{{.TASKFILE_DIR}}'
    cmd: gleam build
  test:browser:
    deps:
      - build
    dir: '{{.TASKFILE_DIR}}'
    cmd: gleam run --module lib_concurrency_browser_driver_main
  link-build-dir:
    cmd:
      task: :build-dir:link-package-build-dir
      vars:
        NAME: '{{.NAME}}'
vars:
  NAME: lib-concurrency
version: '3'
