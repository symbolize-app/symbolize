run: when_changed
tasks:
  check:
    cmd: buck2 build //lib-concurrency:check
  format:check:
    aliases:
    - fc
    cmd: buck2 build //lib-concurrency:format-check
  build:
    dir: '{{.TASKFILE_DIR}}'
    cmd: gleam build
  test:browser:
    deps:
    - build
    dir: '{{.TASKFILE_DIR}}'
    cmd: gleam run --module lib_concurrency_browser_driver_main
  link-build-dir:
    cmd:
      task: :build-dir:link-package-build-dir
      vars:
        NAME: '{{.NAME}}'
  lint:
    aliases:
    - l
    cmd: buck2 build //lib-concurrency:lint
  test:debug:
    aliases:
    - test
    - t
    cmd: buck2 test -m debug //lib-concurrency:test
  test:release:
    aliases:
    - tr
    cmd: buck2 test -m release //lib-concurrency:test
vars:
  NAME: lib-concurrency
version: '3'
