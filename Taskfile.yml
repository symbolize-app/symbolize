includes:
  build-dir:
    taskfile: dev-task/build-dir.yml
  dev-browser-test:
    taskfile: dev-browser-test
  dev-esbuild:
    taskfile: dev-esbuild
  dev-eslint:
    taskfile: dev-eslint
  dev-gen:
    taskfile: dev-gen
  dev-node-test:
    taskfile: dev-node-test
  dev-prettier:
    taskfile: dev-prettier
  dev-sim:
    taskfile: dev-sim
  dev-watchman-client:
    taskfile: dev-watchman-client
  easyrsa:
    taskfile: dev-task/easyrsa.yml
  haskell:
    taskfile: dev-task/haskell.yml
  lib-collection:
    taskfile: lib-collection
  lib-concurrency:
    taskfile: lib-concurrency
  lib-dataflow:
    taskfile: lib-dataflow
  lib-error:
    taskfile: lib-error
  lib-hex:
    taskfile: lib-hex
  lib-hex-rs:
    taskfile: lib-hex-rs
  lib-markup:
    taskfile: lib-markup
  lib-payload:
    taskfile: lib-payload
  lib-random:
    taskfile: lib-random
  lib-stream:
    taskfile: lib-stream
  lib-styling:
    taskfile: lib-styling
  lib-test:
    taskfile: lib-test
  lib-test-runner:
    taskfile: lib-test-runner
  lib-time:
    taskfile: lib-time
  nix:
    taskfile: dev-task/nix.yml
  node:
    taskfile: dev-task/node.yml
  overmind:
    taskfile: dev-task/overmind.yml
  rust:
    taskfile: dev-task/rust.yml
  sqlite:
    taskfile: dev-task/sqlite.yml
  svc-auth-guest-read:
    taskfile: svc-auth-guest-read
  svc-auth-guest-view:
    taskfile: svc-auth-guest-view
  svc-gateway-guest-run:
    taskfile: svc-gateway-guest-run
  svc-gateway-host-run:
    taskfile: svc-gateway-host-run
  svc-gateway-host-store:
    taskfile: svc-gateway-host-store
  svc-search-host-read:
    taskfile: svc-search-host-read
  watchman:
    taskfile: dev-task/watchman.yml
run: when_changed
tasks:
  build:debug:
    aliases:
      - build
      - b
    deps:
      - haskell:build:debug
      - rust:build:debug
      - node:build:debug
  build:release:
    aliases:
      - br
    deps:
      - haskell:build:release
      - rust:build:release
      - node:build:release
  check:
    aliases:
      - c
    cmds:
      - echo "✅"
    deps:
      - build:release
      - vendor:check
      - gen:check
      - test:release
      - format:check
      - lint:check
  clean:
    deps:
      - haskell:clean
      - rust:clean
      - node:clean
  dev:
    aliases:
      - d
    cmd:
      task: overmind:start
    deps:
      - watchman:client:prep
  format:check:
    aliases:
      - fc
    deps:
      - haskell:format:check
      - rust:format:check
      - node:format:check
  format:fix:
    aliases:
      - format
      - f
    deps:
      - haskell:format:fix
      - rust:format:fix
      - node:format:fix
  gen:
    aliases:
      - g
    cmds:
      - buck2 run //dev-gen:symbolize-dev-gen-exe
  gen:check:
    cmds:
      - buck2 run //dev-gen:symbolize-dev-gen-exe -- --check
  gleam:check:
    deps:
      - dev-browser-test:check
      - dev-esbuild:check
      - dev-node-test:check
      - lib-concurrency:check
      - lib-collection:check
      - lib-dataflow:check
      - lib-error:check
      - lib-hex:check
      - lib-markup:check
      - lib-payload:check
      - lib-random:check
      - lib-styling:check
      - lib-stream:check
      - lib-test:check
      - lib-test-runner:check
      - lib-time:check
      - svc-auth-guest-read:check
      - svc-gateway-guest-run:check
      - svc-auth-guest-view:check
  gleam:format:check:
    deps:
      - dev-browser-test:format:check
      - dev-esbuild:format:check
      - dev-node-test:format:check
      - lib-concurrency:format:check
      - lib-collection:format:check
      - lib-dataflow:format:check
      - lib-error:format:check
      - lib-hex:format:check
      - lib-markup:format:check
      - lib-payload:format:check
      - lib-random:format:check
      - lib-styling:format:check
      - lib-stream:format:check
      - lib-test:format:check
      - lib-test-runner:format:check
      - lib-time:format:check
      - svc-auth-guest-read:format:check
      - svc-gateway-guest-run:format:check
      - svc-auth-guest-view:format:check
  gleam:test:
    deps:
      - dev-esbuild:test
      - dev-node-test:test
      - lib-concurrency:test
      - lib-collection:test
      - lib-dataflow:test
      - lib-error:test
      - lib-hex:test
      - lib-markup:test
      - lib-payload:test
      - lib-random:test
      - lib-styling:test
      - lib-stream:test
      - lib-test:test
      - lib-test-runner:test
      - lib-stream:test:http
      - lib-stream:test:custom
      - lib-time:test
      - svc-gateway-guest-run:test
  gleam:test:browser:
    cmds:
      - task node:esbuild:test:browser:built
      - task lib-concurrency:test:browser
      - task lib-dataflow:test:browser
      - task lib-markup:test:browser
      - task lib-random:test:browser
      - task lib-error:test:browser
      - task lib-time:test:browser
      - task lib-stream:test:browser
      - task svc-gateway-guest-run:test:browser
      - task svc-gateway-guest-run:test:browser:service-worker
      - task svc-auth-guest-read:test:browser
      - task svc-auth-guest-view:test:browser
  license:check:
    aliases:
      - vendor:license:check
    cmds:
      - buck2 run //dev-gen:symbolize-dev-gen-exe -- --check-licenses
  lint:check:
    aliases:
      - lint
      - l
    deps:
      - haskell:lint
      - rust:lint:check
      - node:lint:check
      - sqlite:lint:check
  lint:fix:
    aliases:
      - lf
    deps:
      - haskell:lint
      - rust:lint:fix
      - node:lint:fix
      - sqlite:lint:fix
  node:link-build-dirs:
    deps:
      - dev-browser-test:link-build-dir
      - dev-esbuild:link-build-dir
      - dev-eslint:link-build-dir
      - dev-gen:link-build-dir
      - dev-node-test:link-build-dir
      - dev-prettier:link-build-dir
      - lib-collection:link-build-dir
      - lib-concurrency:link-build-dir
      - lib-dataflow:link-build-dir
      - lib-error:link-build-dir
      - lib-hex:link-build-dir
      - lib-markup:link-build-dir
      - lib-payload:link-build-dir
      - lib-random:link-build-dir
      - lib-stream:link-build-dir
      - lib-styling:link-build-dir
      - lib-test:link-build-dir
      - lib-test-runner:link-build-dir
      - lib-time:link-build-dir
      - svc-auth-guest-read:link-build-dir
      - svc-auth-guest-view:link-build-dir
      - svc-gateway-guest-run:link-build-dir
  rust:test:debug:
    aliases:
      - rust:test
      - rust:t
    deps:
      - dev-sim:test:debug
      - dev-watchman-client:test:debug
      - lib-hex-rs:test:debug
      - svc-gateway-host-run:test:debug
      - svc-search-host-read:test:debug
  rust:test:release:
    aliases:
      - rust:tr
    deps:
      - dev-sim:test:release
      - dev-watchman-client:test:release
      - lib-hex-rs:test:release
      - svc-gateway-host-run:test:release
      - svc-search-host-read:test:release
  security:
    aliases:
      - s
    deps:
      - rust:security
  test:release:
    aliases:
      - tr
    deps:
      - haskell:test:release
      - rust:test:release
      - node:test
  vendor:check:
    cmds:
      - buck2 run //dev-gen:symbolize-dev-gen-exe -- --check-vendor
version: "3"
