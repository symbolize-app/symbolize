run: when_changed
tasks:
  check:
    cmd: buck2 build //svc-gateway-guest-run:check
  format:check:
    aliases:
    - fc
    cmd: buck2 build //svc-gateway-guest-run:format-check
  build:
    dir: '{{.TASKFILE_DIR}}'
    cmd: gleam build
  test:browser:
    deps:
    - build
    dir: '{{.TASKFILE_DIR}}'
    cmd: gleam run --module svc_gateway_guest_run_browser_driver_main
  test:browser:service-worker:
    deps:
    - build
    dir: '{{.TASKFILE_DIR}}'
    cmd: gleam run --module svc_gateway_guest_run_service_worker_browser_driver_main
  lint:
    aliases:
    - l
    cmd: buck2 build //svc-gateway-guest-run:lint
  test:debug:
    aliases:
    - test
    - t
    cmd: buck2 test -m debug //svc-gateway-guest-run:test
  test:release:
    aliases:
    - tr
    cmd: buck2 test -m release //svc-gateway-guest-run:test
version: '3'
