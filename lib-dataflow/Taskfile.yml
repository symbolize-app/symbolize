run: when_changed
tasks:
  check:
    cmd: buck2 build //lib-dataflow:check
  format:check:
    aliases:
    - fc
    cmd: buck2 build //lib-dataflow:format-check
  test:browser:
    deps:
    - build
    dir: '{{.TASKFILE_DIR}}/../dev-browser-test'
    cmd: gleam run --module lib_dataflow_browser_driver_main
  build:
    dir: '{{.TASKFILE_DIR}}'
    cmd: gleam build
  link-build-dir:
    cmd:
      task: :build-dir:link-package-build-dir
      vars:
        NAME: '{{.NAME}}'
  lint:
    aliases:
    - l
    cmd: buck2 build //lib-dataflow:lint
  test:debug:
    aliases:
    - test
    - t
    cmd: buck2 test -m debug //lib-dataflow:test
  test:release:
    aliases:
    - tr
    cmd: buck2 test -m release //lib-dataflow:test
vars:
  NAME: lib-dataflow
version: '3'
