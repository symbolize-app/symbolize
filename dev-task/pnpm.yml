version: '3'

run: when_changed

vars:
  ESLINT_ARGS: "--cache --cache-location build/eslint-cache --ignore-path .gitignore --max-warnings 0 --ext js,cjs,mjs"
  PRETTIER_ARGS: --ignore-path .gitignore --check '**/*'.{css,js,json,mjs,html,md,yaml} '!pnpm-lock.yaml' '!target-analyzer/**'

tasks:
  build:debug:
    aliases:
      - build
      - b
    deps:
      - esbuild:build:debug

  build:release:
    aliases:
      - br
    deps:
      - esbuild:build:release

  clean:
    deps:
      - clean:debug
      - clean:release

  clean:debug:
    deps:
      - esbuild:clean:debug
      - eslint:clean

  clean:release:
    deps:
      - esbuild:clean:release
      - eslint:clean

  esbuild:build:debug:
    aliases:
      - esbuild:build
      - esbuild:b
    deps:
      - :dev-esbuild:build
    cmd: ./dev-esbuild/bin/dev-esbuild --mode development

  esbuild:build:debug:watch:
    aliases:
      - esbuild:build:watch
      - esbuild:bw
    deps:
      - :dev-esbuild:build
    cmd:
      task: :watchman:client
      vars:
        WATCH: true
        RESTART: false
        MODE: javascript
        COMMAND: ./dev-esbuild/bin/dev-esbuild --mode development

  esbuild:build:release:
    deps:
      - :dev-esbuild:build
    cmd: ./dev-esbuild/bin/dev-esbuild --mode production

  esbuild:test:browser:built:
    cmds:
      - task: :tmpfs:link-build-dirs
      - task: esbuild:build:debug
      - task: :dev-esbuild:test:browser:built

  esbuild:clean:debug:
    deps:
      - :dev-esbuild:build
    cmd: ./dev-esbuild/bin/dev-esbuild --mode development --clean

  esbuild:clean:release:
    deps:
      - :dev-esbuild:build
    cmd: ./dev-esbuild/bin/dev-esbuild --mode production --clean

  eslint:clean:
    cmd: rm build/eslint-cache

  eslint:lint:check:
    cmd: eslint {{.ESLINT_ARGS}}

  eslint:lint:check:watch:
    cmd:
      task: :watchman:client
      vars:
        WATCH: true
        RESTART: false
        MODE: javascript
        COMMAND: eslint {{.ESLINT_ARGS}}

  eslint:lint:fix:
    cmd: eslint {{.ESLINT_ARGS}} --fix

  format:check:
    aliases:
      - fc
    cmd: prettier {{.PRETTIER_ARGS}}

  format:fix:
    aliases:
      - format
      - f
    cmd: prettier {{.PRETTIER_ARGS}} --write

  install:
    cmd: pnpm install --frozen-lockfile

  lint:check:
    aliases:
      - lint
      - l
    deps:
      - eslint:lint:check

  lint:fix:
    aliases:
      - lf
    deps:
      - eslint:lint:fix

  lock:check:
    cmd: pnpm install --frozen-lockfile --lockfile-only

  test:
    aliases:
      - t
    cmd: task gleam:test

  test:watch:
    aliases:
      - tw
    cmd:
      task: :watchman:client
      vars:
        WATCH: true
        RESTART: false
        MODE: gleam
        COMMAND: task gleam:test
