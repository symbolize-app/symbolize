version: '3'

run: when_changed

vars:
  ESBUILD_VENDOR_DIR: vendor/esbuild-0.19.5
  BETTER_SQLITE3_VENDOR_DIR: vendor/better-sqlite3-11.1.2
  SQLITE_VENDOR_DIR: vendor/sqlite3-3.46.0

tasks:
  check:
    cmd: cabal run dev-gen -- --check-vendor

  license:check:
    desc: Audit all third-party code in vendor/ against approved open-source licenses
    cmd: cabal run dev-gen -- --check-licenses

  rust:gen:
    desc: Regenerate Buck2 build files and target aliases for all vendored Rust crates
    cmd: task gen

  build:
    deps:
      - esbuild:build
      - better-sqlite3:build
      - puppeteer:build

  clean:
    cmd: rm -rf build/vendor

  puppeteer:build:
    deps:
      - esbuild:build
    sources:
      - 'vendor/puppeteer-25.9.0/packages/puppeteer-core/src/injected/**'
      - 'vendor/puppeteer-25.9.0/packages/puppeteer-core/src/templates/**'
    generates:
      - build/vendor/puppeteer/injected.js
    cmds:
      - ./dev-task/build-puppeteer-injected.sh

  esbuild:build:
    sources:
      - '{{.ESBUILD_VENDOR_DIR}}/**'
    generates:
      - build/vendor/esbuild/esbuild
      - build/vendor/esbuild/main.js
    cmds:
      - mkdir -p build/vendor/esbuild
      - >-
        esbuild_bin=$(buck2 build --show-output -m release vendor//esbuild-0.19.5:esbuild | awk '{print $2}') &&
        esbuild_js=$(buck2 build --show-output -m release vendor//esbuild-0.19.5:main.js | awk '{print $2}') &&
        cp "$esbuild_bin" build/vendor/esbuild/esbuild &&
        cp "$esbuild_js" build/vendor/esbuild/main.js

  better-sqlite3:build:
    sources:
      - '{{.BETTER_SQLITE3_VENDOR_DIR}}/**'
      - '{{.SQLITE_VENDOR_DIR}}/**'
    generates:
      - build/vendor/better-sqlite3/better_sqlite3.node
    cmds:
      - mkdir -p build/vendor/better-sqlite3
      - >-
        better_sqlite3_node=$(buck2 build --show-output -m release vendor//better-sqlite3-11.1.2:better-sqlite3 | awk '{print $2}') &&
        cp "$better_sqlite3_node" build/vendor/better-sqlite3/better_sqlite3.node
