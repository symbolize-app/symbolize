version: '3'

run: when_changed

tasks:
  build:debug:
    aliases:
      - build
      - b
    cmd: buck2 build -m debug //dev-sim //dev-watchman-client //svc-gateway-host-run //svc-search-host-read

  build:clippy:debug:watch:
    aliases:
      - build:clippy:watch
      - bcw
    cmd: buck2 run -m {{.TASK_WATCHMAN_CLIENT_MODE}} //dev-watchman-client -- --mode rust -- bash -c 'buck2 build -m debug //dev-sim //dev-watchman-client //svc-gateway-host-run //svc-search-host-read //dev-sim:test //dev-watchman-client:test //lib-hex-rs:test //svc-gateway-host-run:test //svc-search-host-read:test && buck2 bxl -m debug dev_buck//clippy.bxl:check'

  build:release:
    aliases:
      - br
    cmd: buck2 build -m release //dev-sim //dev-watchman-client //svc-gateway-host-run //svc-search-host-read

  clean:
    cmd: buck2 clean

  clippy:lint:check:
    cmd: buck2 bxl -m debug dev_buck//clippy.bxl:check

  clippy:lint:fix:
    cmd: buck2 bxl -m debug dev_buck//clippy.bxl:check

  deny:lint:
    cmd: buck2 run -m {{.TASK_GEN_MODE}} //dev-gen:symbolize-dev-gen-exe -- --check-licenses

  format:check:
    aliases:
      - fc
    cmd: buck2 bxl -m debug dev_buck//format.bxl:check

  format:fix:
    aliases:
      - format
      - f
    cmd: ./dev-buck/format-fix.sh

  lint:check:
    aliases:
      - lint
      - l
    deps:
      - clippy:lint:check

  lint:fix:
    aliases:
      - lf
    deps:
      - clippy:lint:fix

  security:
    deps:
      - deny:lint
