version: '3'

run: when_changed

vars:
  ESLINT_ARGS: "--cache --cache-location build/eslint-cache --ignore-path .gitignore --max-warnings 0 --ext js,cjs,mjs"
  PRETTIER_ARGS: --config dev-prettier/index.json --ignore-path .gitignore --check '**/*'.{css,js,json,mjs,html,md,yaml} '!target-analyzer/**' '!vendor/**'

tasks:
  build:debug:
    aliases:
      - build
      - b
    deps:
      - esbuild:build:debug

  build:release:
    aliases:
      - br
    deps:
      - esbuild:build:release

  clean:
    deps:
      - clean:debug
      - clean:release

  clean:debug:
    deps:
      - eslint:clean

  clean:release:
    deps:
      - eslint:clean

  esbuild:build:debug:
    aliases:
      - esbuild:build
      - esbuild:b
    cmd: buck2 build -m debug //svc-gateway-guest-run:manifest

  esbuild:build:debug:watch:
    aliases:
      - esbuild:build:watch
      - esbuild:bw
    cmd: buck2 run -m {{.TASK_WATCHMAN_CLIENT_MODE}} //dev-watchman-client -- --mode javascript -- buck2 build -m debug //svc-gateway-host-run

  esbuild:build:release:
    cmd: buck2 build -m release //svc-gateway-guest-run:manifest-release

  esbuild:test:browser:built:
    cmds:
      - task: esbuild:build:debug
      - task: :dev-esbuild:test:browser:built

  eslint:clean:
    cmd: rm build/eslint-cache

  eslint:lint:check:
    cmd: eslint --config dev-eslint/index.json {{.ESLINT_ARGS}}

  eslint:lint:check:watch:
    cmd: buck2 run -m {{.TASK_WATCHMAN_CLIENT_MODE}} //dev-watchman-client -- --mode javascript -- eslint --config dev-eslint/index.json {{.ESLINT_ARGS}}

  eslint:lint:fix:
    cmd: eslint --config dev-eslint/index.json {{.ESLINT_ARGS}} --fix

  format:check:
    aliases:
      - fc
    cmd: prettier {{.PRETTIER_ARGS}}

  format:fix:
    aliases:
      - format
      - f
    cmd: prettier {{.PRETTIER_ARGS}} --write

  lint:check:
    aliases:
      - lint
      - l
    deps:
      - eslint:lint:check

  lint:fix:
    aliases:
      - lf
    deps:
      - eslint:lint:fix

  test:
    aliases:
      - t
    cmd: buck2 test -m debug $(buck2 uquery "kind('gleam_test', //...)")

  test:watch:
    aliases:
      - tw
    cmd: buck2 run -m {{.TASK_WATCHMAN_CLIENT_MODE}} //dev-watchman-client -- --mode gleam -- bash -c 'buck2 test -m debug $(buck2 uquery "kind(\"gleam_test\", //...)")'
