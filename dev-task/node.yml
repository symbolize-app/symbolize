version: '3'

run: when_changed

vars:
  ESLINT_ARGS: "--cache --cache-location build/eslint-cache --ignore-path .gitignore --max-warnings 0 --ext js,cjs,mjs"
  PRETTIER_ARGS: --config dev-prettier/index.json --ignore-path .gitignore --check '**/*'.{css,js,json,mjs,html,md,yaml} '!target-analyzer/**' '!vendor/**'

tasks:
  build:debug:
    aliases:
      - build
      - b
    deps:
      - vendor:build
      - esbuild:build:debug

  build:release:
    aliases:
      - br
    deps:
      - vendor:build
      - esbuild:build:release

  clean:
    deps:
      - clean:debug
      - clean:release

  clean:debug:
    deps:
      - esbuild:clean:debug
      - eslint:clean
      - vendor:clean

  clean:release:
    deps:
      - esbuild:clean:release
      - eslint:clean
      - vendor:clean

  vendor:clean:
    cmd: rm -rf build/vendor

  vendor:build:
    sources:
      - vendor/esbuild-0.19.5/**
      - vendor/better-sqlite3-11.1.2/**
      - vendor/sqlite3-3.46.0/**
      - vendor/puppeteer-25.9.0/packages/puppeteer-core/src/injected/**
      - vendor/puppeteer-25.9.0/packages/puppeteer-core/src/templates/**
    generates:
      - build/vendor/esbuild/esbuild
      - build/vendor/esbuild/main.js
      - build/vendor/better-sqlite3/better_sqlite3.node
      - build/vendor/puppeteer/injected.js
    cmds:
      - mkdir -p build/vendor/esbuild build/vendor/better-sqlite3 build/vendor/puppeteer
      - >-
        while read -r target path; do
          case "$target" in
            *better-sqlite3*) cp "$path" build/vendor/better-sqlite3/better_sqlite3.node ;;
            *esbuild-0.19.5:esbuild*) cp "$path" build/vendor/esbuild/esbuild ;;
            *esbuild-0.19.5:main.js*) cp "$path" build/vendor/esbuild/main.js ;;
            *puppeteer*) cp "$path" build/vendor/puppeteer/injected.js ;;
          esac
        done < <(buck2 build --show-output -m release \
          vendor//better-sqlite3-11.1.2:better-sqlite3 \
          vendor//esbuild-0.19.5:esbuild \
          vendor//esbuild-0.19.5:main.js \
          vendor//puppeteer-25.9.0:injected)

  esbuild:build:debug:
    aliases:
      - esbuild:build
      - esbuild:b
    deps:
      - :svc-gateway-host-store:link-build-dir
    cmd: >-
      out=$(buck2 build --show-output //svc-gateway-guest-run:manifest | awk '{print $2}') &&
      ln -sf $(realpath "$out") svc-gateway-host-store/build/manifest.sqlite3

  esbuild:build:debug:watch:
    aliases:
      - esbuild:build:watch
      - esbuild:bw
    deps:
      - :svc-gateway-host-store:link-build-dir
    cmd:
      task: :watchman:client
      vars:
        WATCH: true
        RESTART: false
        MODE: javascript
        COMMAND: task node:esbuild:build:debug

  esbuild:build:release:
    deps:
      - :svc-gateway-host-store:link-build-dir
    cmd: >-
      out=$(buck2 build --show-output //svc-gateway-guest-run:manifest-release | awk '{print $2}') &&
      ln -sf $(realpath "$out") svc-gateway-host-store/build/manifest.sqlite3

  esbuild:test:browser:built:
    cmds:
      - task: :build-dir:link-build-dirs
      - task: esbuild:build:debug
      - task: :dev-esbuild:test:browser:built

  esbuild:clean:debug:
    cmd: rm -f svc-gateway-host-store/build/manifest.sqlite3

  esbuild:clean:release:
    cmd: rm -f svc-gateway-host-store/build/manifest.sqlite3

  eslint:clean:
    cmd: rm build/eslint-cache

  eslint:lint:check:
    cmd: eslint --config dev-eslint/index.json {{.ESLINT_ARGS}}

  eslint:lint:check:watch:
    cmd:
      task: :watchman:client
      vars:
        WATCH: true
        RESTART: false
        MODE: javascript
        COMMAND: eslint --config dev-eslint/index.json {{.ESLINT_ARGS}}

  eslint:lint:fix:
    cmd: eslint --config dev-eslint/index.json {{.ESLINT_ARGS}} --fix

  format:check:
    aliases:
      - fc
    cmd: prettier {{.PRETTIER_ARGS}}

  format:fix:
    aliases:
      - format
      - f
    cmd: prettier {{.PRETTIER_ARGS}} --write

  lint:check:
    aliases:
      - lint
      - l
    deps:
      - eslint:lint:check

  lint:fix:
    aliases:
      - lf
    deps:
      - eslint:lint:fix

  test:
    aliases:
      - t
    cmd: task gleam:test

  test:watch:
    aliases:
      - tw
    cmd:
      task: :watchman:client
      vars:
        WATCH: true
        RESTART: false
        MODE: gleam
        COMMAND: task gleam:test
