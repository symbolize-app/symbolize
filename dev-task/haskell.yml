version: '3'

run: when_changed

tasks:
  build:debug:
    aliases:
      - build
      - b
    cmd: buck2 build -m debug //dev-gen:symbolize-dev-gen-exe //dev-gen:symbolize-dev-gen-test

  build:debug:watch:
    aliases:
      - build:watch
      - bw
    cmd: buck2 run -m {{.TASK_WATCHMAN_CLIENT_MODE}} //dev-watchman-client -- --mode haskell -- buck2 build -m debug //dev-gen:symbolize-dev-gen-exe //dev-gen:symbolize-dev-gen-test

  build:release:
    aliases:
      - br
    cmd: buck2 build -m release //dev-gen:symbolize-dev-gen-exe //dev-gen:symbolize-dev-gen-test

  clean:
    cmd: "true"

  check:
    aliases:
      - c
    cmd: buck2 build -m debug //dev-gen:check

  format:check:
    aliases:
      - fc
    cmd: buck2 build //dev-gen:format-check

  format:fix:
    aliases:
      - format
      - f
    cmd: ./dev-buck/format-fix.sh

  lint:
    aliases:
      - l
    cmd: buck2 build //dev-gen:lint

  lint:watch:
    aliases:
      - lw
    cmd: buck2 run -m {{.TASK_WATCHMAN_CLIENT_MODE}} //dev-watchman-client -- --mode haskell -- buck2 build //dev-gen:lint

  test:debug:
    aliases:
      - test
      - t
    cmd: buck2 test -m debug //dev-gen:test

  test:release:
    aliases:
      - tr
    cmd: buck2 test -m release //dev-gen:test
