version: '3'

run: when_changed

vars:
  NAME: dev-gen

tasks:
  build:debug:
    aliases:
      - build
      - b
    cmd: buck2 build -m debug //dev-gen:symbolize-dev-gen-exe //dev-gen:symbolize-dev-gen-test

  build:debug:watch:
    aliases:
      - build:watch
      - bw
    cmd:
      task: :watchman:client
      vars:
        WATCH: true
        RESTART: false
        MODE: haskell
        COMMAND: buck2 build -m debug //dev-gen:symbolize-dev-gen-exe //dev-gen:symbolize-dev-gen-test

  build:release:
    aliases:
      - br
    cmd: buck2 build -m release //dev-gen:symbolize-dev-gen-exe //dev-gen:symbolize-dev-gen-test

  clean:
    cmd: "true"

  execute-target:
    internal: true
    requires:
      vars:
        - WATCH
        - MODE
        - NAME
        - TARGET
        - ARGS
    cmds:
      - cmd: 'true # /{{.WATCH}}/{{.MODE}}/{{.NAME}}/{{.TARGET}}/{{.ARGS}}/'
        silent: true
      - task: :watchman:client
        vars:
          WATCH: '{{.WATCH}}'
          RESTART: false
          MODE: executable
          COMMAND: 'buck2 run -m {{.MODE}} //{{.NAME}}:symbolize-{{.NAME}}-exe -- {{.ARGS}} {{.CLI_ARGS}}'

  execute-target:run:debug:
    internal: true
    requires:
      vars:
        - NAME
    cmd: buck2 run -m debug //{{.NAME}}:symbolize-{{.NAME}}-exe -- {{.ARGS}} {{.CLI_ARGS}}

  execute-target:run:release:
    internal: true
    requires:
      vars:
        - NAME
    cmd: buck2 run -m release //{{.NAME}}:symbolize-{{.NAME}}-exe -- {{.ARGS}} {{.CLI_ARGS}}

  execute-target:test:debug:
    internal: true
    requires:
      vars:
        - NAME
    cmd: buck2 test -m debug //{{.NAME}}:test

  execute-target:test:debug:watch:
    internal: true
    requires:
      vars:
        - NAME
    cmd:
      task: :watchman:client
      vars:
        WATCH: true
        RESTART: false
        MODE: haskell
        COMMAND: buck2 test -m debug //{{.NAME}}:test

  execute-target:test:release:
    internal: true
    requires:
      vars:
        - NAME
    cmd: buck2 test -m release //{{.NAME}}:test

  check:
    aliases:
      - c
    cmd: buck2 build -m debug //dev-gen:check

  format:check:
    aliases:
      - fc
    cmd: buck2 build //dev-gen:format-check

  format:fix:
    aliases:
      - format
      - f
    cmd: ./dev-buck/format-fix.sh

  lint:
    aliases:
      - l
    cmd:
      task: lint:exec
      vars:
        WATCH: false

  lint:exec:
    internal: true
    requires:
      vars:
        - WATCH
    cmd:
      task: :watchman:client
      vars:
        WATCH: '{{.WATCH}}'
        RESTART: false
        MODE: haskell
        COMMAND: buck2 build //dev-gen:lint

  lint:watch:
    aliases:
      - lw
    cmd:
      task: lint:exec
      vars:
        WATCH: true

  test:debug:
    aliases:
      - test
      - t
    deps:
      - :dev-gen:test:debug

  test:release:
    aliases:
      - tr
    deps:
      - :dev-gen:test:release
