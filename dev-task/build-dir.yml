version: '3'

run: when_changed

tasks:
  link-build-dirs:
    deps:
      - link-root-build-dir
    cmd:
      task: link-package-build-dirs

  link-package-build-dir:
    internal: true
    requires:
      vars:
        - NAME
    status:
      - test -f {{.NAME}}/gleam.toml && test ! -L {{.NAME}}/build && test -d {{.NAME}}/build || test ! -f {{.NAME}}/gleam.toml && test "$(readlink {{.NAME}}/build)" = ../build/{{.NAME}} && test -d build/{{.NAME}}
    cmds:
      - |
        if test -f {{.NAME}}/gleam.toml; then
          if test -L {{.NAME}}/build; then
            rm -f {{.NAME}}/build
            mkdir -p {{.NAME}}/build
          else
            mkdir -p {{.NAME}}/build
          fi
        else
          rm -rf {{.NAME}}/build
          ln -s ../build/{{.NAME}} {{.NAME}}/build
          mkdir -p build/{{.NAME}}
        fi

  link-package-build-dirs:
    deps:
      - :node:link-build-dirs
      - :sqlite:link-build-dirs

  link-root-build-dir:
    status:
      - test -d build && test ! -L build
    cmds:
      - mkdir -p build

