version: '3'

run: when_changed

tasks:
  link-build-dirs:
    deps:
      - link-root-build-dir
    cmd:
      task: link-package-build-dirs

  link-package-build-dir:
    internal: true
    requires:
      vars:
        - NAME
    status:
      - test "$(readlink {{.NAME}}/build)" = ../build/{{.NAME}}
      - test -d build/{{.NAME}}
    cmds:
      - mkdir -p build/{{.NAME}}
      - rm -rf {{.NAME}}/build
      - ln -s ../build/{{.NAME}} {{.NAME}}/build

  link-package-build-dirs:
    deps:
      - :node:link-build-dirs
      - :sqlite:link-build-dirs

  link-root-build-dir:
    status:
      - test -d build && test ! -L build
    cmds:
      - mkdir -p build

