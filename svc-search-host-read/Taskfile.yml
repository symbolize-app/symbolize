run: when_changed
tasks:
  run:debug:
    aliases:
      - run
      - r
    cmds:
      - buck2 run -m debug //svc-search-host-read -- {{.CLI_ARGS}}
  run:debug:watch:
    aliases:
      - run:watch
      - rw
    cmds:
      - buck2 run -m {{.TASK_WATCHMAN_CLIENT_MODE}} //dev-watchman-client -- --target
        //svc-search-host-read --restart -- {{.CLI_ARGS}}
  run:release:
    aliases:
      - rr
    cmds:
      - buck2 run -m release //svc-search-host-read -- {{.CLI_ARGS}}
  test:debug:
    aliases:
      - test
      - t
    cmds:
      - buck2 test -m debug //svc-search-host-read:test
  test:debug:watch:
    aliases:
      - test:watch
      - tw
    cmds:
      - buck2 run -m {{.TASK_WATCHMAN_CLIENT_MODE}} //dev-watchman-client -- --target
        //svc-search-host-read:test
  test:release:
    aliases:
      - tr
    cmds:
      - buck2 test -m release //svc-search-host-read:test
vars:
  NAME: svc-search-host-read
version: "3"
