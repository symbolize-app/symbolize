run: when_changed
tasks:
  check:
    cmd: buck2 build //lib-hex:check
  format:check:
    aliases:
    - fc
    cmd: buck2 build //lib-hex:format-check
  link-build-dir:
    cmd:
      task: :build-dir:link-package-build-dir
      vars:
        NAME: '{{.NAME}}'
  lint:
    aliases:
    - l
    cmd: buck2 build //lib-hex:lint
  test:debug:
    aliases:
    - test
    - t
    cmd: buck2 test -m debug //lib-hex:test
  test:release:
    aliases:
    - tr
    cmd: buck2 test -m release //lib-hex:test
vars:
  NAME: lib-hex
version: '3'
