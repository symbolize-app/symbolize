version: '3'

run: when_changed

includes:
  cabal:
    taskfile: dev-task/cabal.yml

  cargo:
    taskfile: dev-task/cargo.yml

  dev-browser-test:
    taskfile: dev-browser-test

  dev-gen:
    taskfile: dev-gen

  dev-esbuild:
    taskfile: dev-esbuild

  dev-eslint:
    taskfile: dev-eslint

  dev-pnpm-test:
    taskfile: dev-pnpm-test

  dev-prettier:
    taskfile: dev-prettier

  dev-watchman-client:
    taskfile: dev-watchman-client

  easyrsa:
    taskfile: dev-task/easyrsa.yml

  font:
    taskfile: dev-task/font.yml

  nix:
    taskfile: dev-task/nix.yml

  overmind:
    taskfile: dev-task/overmind.yml

  pnpm:
    taskfile: dev-task/pnpm.yml

  sqlite:
    taskfile: dev-task/sqlite.yml

  svc-gateway-host-store:
    taskfile: svc-gateway-host-store

  lib-collection:
    taskfile: lib-collection

  lib-concurrency:
    taskfile: lib-concurrency

  lib-dataflow:
    taskfile: lib-dataflow

  lib-error:
    taskfile: lib-error

  lib-hex:
    taskfile: lib-hex

  lib-markup:
    taskfile: lib-markup

  lib-payload:
    taskfile: lib-payload

  lib-random:
    taskfile: lib-random

  lib-stream:
    taskfile: lib-stream

  lib-styling:
    taskfile: lib-styling

  lib-test:
    taskfile: lib-test

  lib-test-runner:
    taskfile: lib-test-runner

  lib-time:
    taskfile: lib-time

  svc-auth-guest-read:
    taskfile: svc-auth-guest-read

  svc-auth-guest-view:
    taskfile: svc-auth-guest-view

  svc-gateway-guest-run:
    taskfile: svc-gateway-guest-run

  tmpfs:
    taskfile: dev-task/tmpfs.yml

  watchman:
    taskfile: dev-task/watchman.yml

tasks:
  build:debug:
    aliases:
      - build
      - b
    deps:
      - cabal:build:debug
      - cargo:build:debug
      - pnpm:build:debug

  build:release:
    aliases:
      - br
    deps:
      - cabal:build:release
      - cargo:build:release
      - pnpm:build:release

  check:
    aliases:
      - c
    deps:
      - build:release
      - gen:check
      - test:release
      - format:check
      - lint:check
      - lock:check
    cmds:
      - echo "✅"

  clean:
    deps:
      - cabal:clean
      - cargo:clean
      - pnpm:clean

  dev:
    aliases:
      - d
    deps:
      - watchman:client:prep
    cmd:
      task: overmind:start

  format:check:
    aliases:
      - fc
    deps:
      - cabal:format:check
      - cargo:format:check
      - pnpm:format:check

  format:fix:
    aliases:
      - format
      - f
    deps:
      - cabal:format:fix
      - cargo:format:fix
      - pnpm:format:fix

  gleam:check:
    deps:
      - dev-browser-test:check
      - dev-esbuild:check
      - dev-pnpm-test:check
      - lib-concurrency:check
      - lib-collection:check
      - lib-dataflow:check
      - lib-error:check
      - lib-hex:check
      - lib-markup:check
      - lib-payload:check
      - lib-random:check
      - lib-styling:check
      - lib-stream:check
      - lib-test:check
      - lib-test-runner:check
      - lib-time:check
      - svc-auth-guest-read:check
      - svc-gateway-guest-run:check
      - svc-auth-guest-view:check

  gleam:format:check:
    deps:
      - dev-browser-test:format:check
      - dev-esbuild:format:check
      - dev-pnpm-test:format:check
      - lib-concurrency:format:check
      - lib-collection:format:check
      - lib-dataflow:format:check
      - lib-error:format:check
      - lib-hex:format:check
      - lib-markup:format:check
      - lib-payload:format:check
      - lib-random:format:check
      - lib-styling:format:check
      - lib-stream:format:check
      - lib-test:format:check
      - lib-test-runner:format:check
      - lib-time:format:check
      - svc-auth-guest-read:format:check
      - svc-gateway-guest-run:format:check
      - svc-auth-guest-view:format:check

  gleam:test:
    deps:
      - dev-esbuild:test
      - dev-pnpm-test:test
      - lib-concurrency:test
      - lib-collection:test
      - lib-dataflow:test
      - lib-error:test
      - lib-hex:test
      - lib-markup:test
      - lib-payload:test
      - lib-random:test
      - lib-styling:test
      - lib-stream:test
      - lib-test:test
      - lib-test-runner:test
      - lib-stream:test:http
      - lib-stream:test:custom
      - lib-time:test
      - svc-gateway-guest-run:test

  gleam:test:browser:
    cmds:
      - task pnpm:esbuild:test:browser:built
      - task lib-concurrency:test:browser
      - task lib-dataflow:test:browser
      - task lib-markup:test:browser
      - task lib-random:test:browser
      - task lib-error:test:browser
      - task lib-time:test:browser
      - task lib-stream:test:browser
      - task svc-gateway-guest-run:test:browser
      - task svc-gateway-guest-run:test:browser:service-worker
      - task svc-auth-guest-read:test:browser
      - task svc-auth-guest-view:test:browser

  pnpm:link-build-dirs:
    deps:
      - dev-browser-test:link-build-dir
      - dev-esbuild:link-build-dir
      - dev-pnpm-test:link-build-dir
      - dev-prettier:link-build-dir
      - dev-eslint:link-build-dir
      - lib-collection:link-build-dir
      - lib-dataflow:link-build-dir
      - lib-markup:link-build-dir
      - lib-styling:link-build-dir
      - lib-test:link-build-dir
      - lib-test-runner:link-build-dir

  gen:
    aliases:
      - g
    cmd:
      task: cabal:execute-target:run:{{.TASK_GEN_MODE}}
      vars:
        NAME: dev-gen

  gen:check:
    cmd:
      task: cabal:execute-target:run:{{.TASK_GEN_MODE}}
      vars:
        NAME: dev-gen
        ARGS: '--check'

  install:
    aliases:
      - i
    deps:
      - cabal:install
      - cargo:install
      - font:install
      - pnpm:install

  lint:check:
    aliases:
      - lint
      - l
    deps:
      - cabal:lint
      - cargo:lint:check
      - pnpm:lint:check
      - sqlite:lint:check

  lint:fix:
    aliases:
      - lf
    deps:
      - cabal:lint
      - cargo:lint:fix
      - pnpm:lint:fix
      - sqlite:lint:fix

  lock:check:
    deps:
      - cargo:lock:check
      - pnpm:lock:check

  security:
    aliases:
      - s
    deps:
      - cargo:security

  test:release:
    aliases:
      - tr
    deps:
      - cabal:test:release
      - cargo:test:release
      - pnpm:test
