version: '3'

run: when_changed

includes:
  haskell:
    taskfile: dev-task/haskell.yml

  rust:
    taskfile: dev-task/rust.yml

  dev-browser-test:
    taskfile: dev-browser-test

  dev-gen:
    taskfile: dev-gen

  dev-esbuild:
    taskfile: dev-esbuild

  dev-eslint:
    taskfile: dev-eslint

  dev-node-test:
    taskfile: dev-node-test

  dev-prettier:
    taskfile: dev-prettier

  dev-watchman-client:
    taskfile: dev-watchman-client

  easyrsa:
    taskfile: dev-task/easyrsa.yml

  nix:
    taskfile: dev-task/nix.yml

  overmind:
    taskfile: dev-task/overmind.yml

  node:
    taskfile: dev-task/node.yml

  sqlite:
    taskfile: dev-task/sqlite.yml

  svc-gateway-host-store:
    taskfile: svc-gateway-host-store

  lib-collection:
    taskfile: lib-collection

  lib-concurrency:
    taskfile: lib-concurrency

  lib-dataflow:
    taskfile: lib-dataflow

  lib-error:
    taskfile: lib-error

  lib-hex:
    taskfile: lib-hex

  lib-markup:
    taskfile: lib-markup

  lib-payload:
    taskfile: lib-payload

  lib-random:
    taskfile: lib-random

  lib-stream:
    taskfile: lib-stream

  lib-styling:
    taskfile: lib-styling

  lib-test:
    taskfile: lib-test

  lib-test-runner:
    taskfile: lib-test-runner

  lib-time:
    taskfile: lib-time

  svc-auth-guest-read:
    taskfile: svc-auth-guest-read

  svc-auth-guest-view:
    taskfile: svc-auth-guest-view

  svc-gateway-guest-run:
    taskfile: svc-gateway-guest-run

  build-dir:
    taskfile: dev-task/build-dir.yml

  watchman:
    taskfile: dev-task/watchman.yml

tasks:
  build:debug:
    aliases:
      - build
      - b
    deps:
      - haskell:build:debug
      - rust:build:debug
      - node:build:debug

  build:release:
    aliases:
      - br
    deps:
      - haskell:build:release
      - rust:build:release
      - node:build:release

  check:
    aliases:
      - c
    deps:
      - build:release
      - vendor:check
      - gen:check
      - test:release
      - format:check
      - lint:check
    cmds:
      - echo "✅"

  clean:
    deps:
      - haskell:clean
      - rust:clean
      - node:clean

  dev:
    aliases:
      - d
    cmd:
      task: overmind:start

  format:check:
    aliases:
      - fc
    deps:
      - haskell:format:check
      - rust:format:check
      - node:format:check

  format:fix:
    aliases:
      - format
      - f
    deps:
      - haskell:format:fix
      - rust:format:fix
      - node:format:fix

  gleam:check:
    cmds:
      - buck2 build -m debug $(buck2 uquery 'kind("gleam_package", //...)' | sed 's/:[^:]*$/:check/')

  gleam:format:check:
    cmds:
      - buck2 build $(buck2 uquery 'kind("gleam_package", //...)' | sed 's/:[^:]*$/:format-check/')

  gleam:lint:check:
    cmds:
      - buck2 build $(buck2 uquery 'kind("gleam_package", //...)' | sed 's/:[^:]*$/:lint/')

  gleam:test:
    cmds:
      - buck2 test -m debug $(buck2 uquery "kind('gleam_test', //...)")

  gleam:test:browser:
    cmds:
      - task node:esbuild:test:browser:built
      - task lib-concurrency:test:browser
      - task lib-dataflow:test:browser
      - task lib-markup:test:browser
      - task lib-random:test:browser
      - task lib-error:test:browser
      - task lib-time:test:browser
      - task lib-stream:test:browser
      - task svc-gateway-guest-run:test:browser
      - task svc-gateway-guest-run:test:browser:service-worker
      - task svc-auth-guest-read:test:browser
      - task svc-auth-guest-view:test:browser

  node:link-build-dirs:
    deps:
      - dev-browser-test:link-build-dir
      - dev-esbuild:link-build-dir
      - dev-eslint:link-build-dir
      - dev-gen:link-build-dir
      - dev-node-test:link-build-dir
      - dev-prettier:link-build-dir
      - lib-collection:link-build-dir
      - lib-concurrency:link-build-dir
      - lib-dataflow:link-build-dir
      - lib-error:link-build-dir
      - lib-hex:link-build-dir
      - lib-markup:link-build-dir
      - lib-payload:link-build-dir
      - lib-random:link-build-dir
      - lib-stream:link-build-dir
      - lib-styling:link-build-dir
      - lib-test:link-build-dir
      - lib-test-runner:link-build-dir
      - lib-time:link-build-dir
      - svc-auth-guest-read:link-build-dir
      - svc-auth-guest-view:link-build-dir
      - svc-gateway-guest-run:link-build-dir

  gen:
    aliases:
      - g
    cmds:
      - buck2 run -m {{.TASK_GEN_MODE}} //dev-gen:symbolize-dev-gen-exe

  gen:check:
    cmds:
      - buck2 run -m {{.TASK_GEN_MODE}} //dev-gen:symbolize-dev-gen-exe -- --check

  vendor:check:
    cmds:
      - buck2 run -m {{.TASK_GEN_MODE}} //dev-gen:symbolize-dev-gen-exe -- --check-vendor

  license:check:
    aliases:
      - vendor:license:check
    cmds:
      - buck2 run -m {{.TASK_GEN_MODE}} //dev-gen:symbolize-dev-gen-exe -- --check-licenses

  lint:check:
    aliases:
      - lint
      - l
    deps:
      - gleam:lint:check
      - haskell:lint
      - rust:lint:check
      - node:lint:check
      - sqlite:lint:check

  lint:fix:
    aliases:
      - lf
    deps:
      - gleam:lint:check
      - haskell:lint
      - rust:lint:fix
      - node:lint:fix
      - sqlite:lint:fix

  security:
    aliases:
      - s
    deps:
      - rust:security

  test:debug:
    aliases:
      - test
      - t
    cmds:
      - buck2 test -m debug //...

  test:release:
    aliases:
      - tr
    cmds:
      - buck2 test -m release //...
