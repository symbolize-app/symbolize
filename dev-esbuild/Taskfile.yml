run: when_changed
tasks:
  check:
    cmd: buck2 build //dev-esbuild:check
  format:check:
    aliases:
    - fc
    cmd: buck2 build //dev-esbuild:format-check
  test:
    cmds:
    - task: test:output
    - task: test:build
  test:build:
    deps:
    - build
    dir: '{{.TASKFILE_DIR}}'
    cmd: gleam run --module dev_esbuild_build_test_main
  test:output:
    deps:
    - build
    dir: '{{.TASKFILE_DIR}}'
    cmd: gleam run --module dev_esbuild_output_test_main
  test:browser:built:
    dir: '{{.TASKFILE_DIR}}'
    cmds:
    - gleam run --module dev_esbuild_built_service_worker_browser_driver_main
    - gleam run --module dev_esbuild_development_graph_browser_driver_main
  build:
    deps:
    - :svc-gateway-guest-run:build
    dir: '{{.TASKFILE_DIR}}'
    cmd: gleam build
  lint:
    aliases:
    - l
    cmd: buck2 build //dev-esbuild:lint
  test:debug:
    aliases:
    - test
    - t
    cmd: buck2 test -m debug //dev-esbuild:test
  test:release:
    aliases:
    - tr
    cmd: buck2 test -m release //dev-esbuild:test
version: '3'
