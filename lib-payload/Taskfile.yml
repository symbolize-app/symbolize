run: when_changed
tasks:
  check:
    cmd: buck2 build //lib-payload:check
  format:check:
    aliases:
    - fc
    cmd: buck2 build //lib-payload:format-check
  lint:
    aliases:
    - l
    cmd: buck2 build //lib-payload:lint
  test:debug:
    aliases:
    - test
    - t
    cmd: buck2 test -m debug //lib-payload:test
  test:release:
    aliases:
    - tr
    cmd: buck2 test -m release //lib-payload:test
version: '3'
